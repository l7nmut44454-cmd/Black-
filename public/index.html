<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>التسجيل</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="brandbar"></div>
<main class="wrap">
  <header class="hero">
    <h1>سجّل بياناتك</h1>
    <p>املأ الخانات التالية وسنتواصل معك.</p>
  </header>

  <section class="card" id="formCard">
    <div id="error" class="msg err hidden" role="alert"></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="full_name">الاسم بالكامل</label>
        <input type="text" id="full_name" name="full_name" autocomplete="name" maxlength="100" required>
      </div>
      <div class="field">
        <label for="phone">رقم الهاتف</label>
        <input type="tel" id="phone" name="phone" dir="ltr" inputmode="tel" autocomplete="tel" maxlength="20" required>
        <div class="hint">مثال: 01012345678 أو +201012345678</div>
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" dir="ltr" inputmode="email" autocomplete="email" maxlength="150" required>
      </div>
      <button type="submit" id="submit">إرسال</button>
    </form>
  </section>

  <section class="card success hidden" id="done" aria-live="polite">
    <h2>تم التسجيل بنجاح</h2>
    <p>وصلتنا بياناتك. شكرًا لك.</p>
    <button type="button" class="btn-ghost" id="again">تسجيل شخص آخر</button>
  </section>

  <p class="foot">بياناتك محفوظة بشكل آمن ولا يراها أي زائر آخر.</p>
</main>
<script src="/app.js"></script>
</body>
</html>
